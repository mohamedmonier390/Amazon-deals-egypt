workflows:
  android-debug:
    name: Amazon Deals Egypt - Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          cd android
          gradle assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
